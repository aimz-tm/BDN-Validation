validation:
  max_distance_m: 200
  min_overlap_percent: 70
  max_speed_during_delivery: 3.0
  max_ais_gap_minutes: 60

ocr:
  confidence_threshold: 0.85

ais:
  sampling_interval_minutes: 10
  rate_limit_per_hour: 100

marpol:
  density_min: 0.820
  density_max: 1.010
  sulphur_max: 0.50
  flashpoint_min: 60.0

scoring:
  weights:
    document_integrity: 0.40
    data_anomalies: 0.35
    compliance_gaps: 0.25
  thresholds:
    valid_min_score: 70
    suspicious_min_score: 40